# ---- Gradle ----
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.caching=true

# 注意：Fabric Loom 1.18.2 自身是 Java 25 编译的，跑 Gradle 的 JVM **必须是 JDK 25**。
# 但每个人装的路径不一样，所以这里不写死，请放到你自己的 ~/.gradle/gradle.properties 里：
#     org.gradle.java.home=<你的 JDK 25 路径>
# 模组字节码本身仍然是 release 21（见 build.gradle），运行服务端用 JDK 21+ 都可以。

# ---- 版本 ----
minecraft_version=1.21.1
fabric_loader_version=0.19.5
loom_version=1.18.2

# ---- 模组元数据 ----
mod_version=1.0.1
maven_group=com.kaelorvyn
archives_base_name=legacyforward
